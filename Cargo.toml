[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/lorem-dev/doppel"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1.9"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
# Already in the tree under hyper, and the only calendar in it. The dashboard's
# footer needs the year the binary was built, and turning a unix timestamp into
# one is leap years and century rules -- not arithmetic worth writing here.
httpdate = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
minijinja = "2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
sentry-tracing = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
# No default features: the default TLS backend is native-tls, and this
# workspace is rustls-only.
#
# `macros` is on because `migrate!` lives behind it. That macro embeds the
# migration files at build time and needs no database, unlike `query!`, which
# is deliberately not used (phase 4 specification, section 4). Enabling the
# feature makes `query!` reachable, so the flag is not what prevents it -- the
# build failing loudly with no `DATABASE_URL` is.
sqlx = { version = "0.9", default-features = false, features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
] }
tempfile = "3"
utoipa = "5"
utoipa-swagger-ui = { version = "9", default-features = false, features = ["axum", "vendored"] }
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower = "0.5"
# Already in the graph through utoipa-swagger-ui, and only `normalize-path` is
# taken from it: one trailing slash is not worth a hand-written middleware.
tower-http = { version = "0.6", default-features = false, features = ["normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
