[package]
name = "doppel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "doppel"
path = "src/main.rs"

[features]
# Passed through so `cargo build --features sentry` on the binary does what it
# reads as doing.
sentry = ["doppel-telemetry/sentry"]

[dependencies]
doppel-admin = { path = "../doppel-admin" }
doppel-core = { path = "../doppel-core" }
doppel-store-postgres = { path = "../doppel-store-postgres" }
doppel-proxy = { path = "../doppel-proxy" }
doppel-telemetry = { path = "../doppel-telemetry" }
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking"] }
tempfile.workspace = true

[lints]
workspace = true
