[package]
name = "doppel-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Off by default: Sentry is optional, and a default build should not carry a
# TLS stack and an HTTP client it never uses.
sentry = ["dep:sentry", "dep:sentry-tracing"]

[dependencies]
doppel-core = { path = "../doppel-core" }
sentry = { workspace = true, optional = true }
sentry-tracing = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
