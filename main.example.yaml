# yaml-language-server: $schema=https://raw.githubusercontent.com/lorem-dev/doppel/main/doppel-config.schema.json
#
# Doppel reference configuration.
# Copy to main.yaml and adjust; main.yaml is git-ignored.
#
# The line above is what editors read: VS Code's YAML extension and any
# yaml-language-server client will complete field names, show each field's
# description and mark a bad value as you type. Keep it at the top of your own
# main.yaml. The schema is generated from the code -- see
# `doppel config schema` -- and every release also attaches it as an asset for
# anyone who would rather pin a version than follow `main`.

server:
  host: "0.0.0.0"
  port: 8080

logging:
  level: info   # trace | debug | info | warn | error
  format: json  # json | text

control:
  socket: /tmp/doppel.sock  # `doppel config reload` talks to this socket

templates:
  dir: ./templates  # uploaded template files are materialized here

admin:
  # false runs the proxy with no admin application at all: the port is never
  # bound, and `doppel config reload` becomes the only way in. Takes effect on
  # restart, not on reload.
  enable: true
  host: "0.0.0.0"
  port: 8081
  # Serve the admin API unauthenticated: every action answers as `public`,
  # for anyone. Overrides `access`, `groups` and any proxy override, which
  # startup then reports as ignored. Off by default.
  public: false
  # Which names `access` may reference, here and per proxy. "*" is any;
  # ["admin", "ci"] allows exactly those. Never governs `public` itself.
  # `public` and `admin` are always available whatever the list says.
  # [] names nobody, which means the same as `public: true`. Rule V36.
  groups: ["*"]
  # Serve the browser dashboard from this listener's root. On by default; false
  # leaves `/`, `/static/*` and `/robots.txt` unrouted and the JSON API
  # untouched. Takes effect on restart.
  dashboard: true
  # The heading the dashboard shows, and the browser tab's title. Left out here,
  # and left out is worth seeing: with no title the header draws the project's
  # wordmark, which is the state a first run should show. Set it to a name --
  # "billing-api (staging)" -- once several Doppels are open at once.
  #
  # title: "Doppel"
  auth:
    header: X-Proxy-Authorization  # expects "Bearer {token}"
  tokens:
    - name: user1
      group: admin  # admin and user are predefined; custom group names allowed
      token: c0a721e2-90ff-40f0-a230-c1ab83d751d8
    - name: user2
      group: user
      token: e14887ef-4025-42d0-81db-a72a2cb3cb76
  # public, a single token or group name, or a list of them. Every action
  # defaults to the `admin` group, reads included: a proxy document contains
  # the `headers` it injects upstream -- see proxy1's `Authorization` below --
  # so a public listing publishes those credentials. Set an action to
  # `public` only once you are sure nothing under `proxies` is a secret.
  access:
    list: ["admin", "user"]
    read: ["admin", "user"]
    create: ["admin"]
    update: user1
    delete: admin
    upload: admin
  upload:
    limit: 1Mi

proxies:
  - name: proxy1
    type: http
    url: "https://external-service.com/api/v1/"
    timeout: 60
    resolve:
      type: default
    access:  # per-proxy override; read, update, delete, upload only
      read: ["user1", "user2"]
      update: user1
    headers:
      Authorization: "Bearer 1234567890"
    loss:
      percentage: 0.1  # drop 10 percent of requests
      status: 503
    latency:
      percentage: 0.45  # delay 45 percent of requests
      min: 0.05         # seconds
      max: 0.2
    replace: 1.0  # serve mocks for 100 percent of matching requests
    # Rewrite a redirect whose target is under this proxy's base so it points
    # back here instead of at the upstream; on by default. Set it to false to
    # relay Location byte for byte.
    rewrite_redirects: true
    body_limit: 1Mi  # bounds the body buffered for mocks that extract from it (mock2, mock6 below); default 1Mi
    # Order matters. Patterns are matched as unanchored regexes, so a general
    # pattern placed first shadows every more specific one below it: with
    # `/api/v1/resource/` ahead of `/api/v1/resource/(?P<resourceId>\d+)/`,
    # the second can never fire, because the first already matches that path.
    # Specific patterns therefore come first here. Doppel does not detect this
    # for you -- a shadowed mock is a valid configuration, just a useless one.
    mocks:
      - name: mock3
        request:
          method: GET
          url: /api/v1/resource/42/
        response:
          status: 200
          json: '{"message": "Success"}'
        proxy:  # per-mock override of the proxy fault settings
          replace: 0.5
          latency:
            percentage: 0.5
            min: 0.1
            max: 0.3
      - name: mock4
        # Referencing an extracted header makes that header required: rendering
        # is strict, so a request without X-Request-ID fails this mock with
        # TEMPLATE_RENDER_ERROR rather than rendering an empty string. Use
        # `{{ requestId | default('') }}` in the templates below if the header
        # should be optional.
        request:
          method: GET
          url: /api/v1/resource/(?P<resourceId>\d+)/
          headers:
            requestId: X-Request-ID
        response:
          status: 200
          json: '{"message": "Success", "id": "{{ resourceId }}"}'
          headers:
            X-Resource-ID: "{{ resourceId }}"
            X-Request-ID: "{{ requestId }}"
      - name: mock5
        request:
          method: DELETE
          url: /api/v1/resource/(?P<resourceId>\d+)/
          headers:
            requestId: X-Request-ID
        response:
          status: 204  # 204 forbids a body, so none is declared
          headers:
            X-Resource-ID: "{{ resourceId }}"
      - name: mock6
        request:
          method: PUT
          url: /api/v1/resource/(?P<resourceId>\d+)/
          body:
            resourceName: .name
            resourceDescription: .description
            resourceItems: .content.items
        response:
          status: 200
          template: put.json.j2
          headers:
            Content-Type: application/json
        proxy:
          loss:
            percentage: 0.0
            status: 503
      - name: mock1
        request:
          method: GET
          url: /api/v1/resource/
        response:
          status: 200
          body: '{"message": "Success"}'
          headers:
            Content-Type: application/json
      - name: mock2
        request:
          method: POST
          url: /api/v1/resource/
          body:
            resourceName: .name
            resourceDescription: .description
            resourceItems: .content.items
          query:
            filter: .filter
            sort: .sort
        response:
          status: 201
          json: '{"message": "Resource created", "name": "{{ resourceName }}", "description": "{{ resourceDescription }}", "items": {{ resourceItems | length }}}'
          headers:
            Content-Type: application/json

  - name: proxy2
    type: http
    url: "https://other-service.com/"
    resolve:
      type: header
      header: X-Proxy-Name  # the header value names the proxy
