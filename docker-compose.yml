# Two things, deliberately not started together.
#
# **The database**, for local work and for the PostgreSQL integration tests, is
# what comes up by default:
#
#   docker compose up -d --wait
#   export DOPPEL_TEST_DATABASE_URL=postgres://doppel:doppel@127.0.0.1:55432/doppel
#   cargo test
#
# Without that variable those tests print a skip line and pass, which keeps
# `cargo test` green on a machine with no database. The `run-tests-and-linters`
# skill brings this file up itself, so "skipped" does not quietly become "never
# verified".
#
# **Doppel itself**, behind a profile, for trying the two together:
#
#   mkdir -p config && cp main.example.yaml config/main.yaml
#   docker compose --profile doppel up -d --wait
#
# `make frontend` first is optional and only faster; the image builds the
# dashboard itself when `frontend/dist` is absent. The copy is not optional: a
# bind mount whose source is missing makes Docker create an empty *directory*
# there, and Doppel then reports it cannot read /etc/doppel/main.yaml.
#
# The profile is what keeps the two apart, and it has to: running the proxy
# during a test run would put a second process on the ports and the templates
# directory the integration tests bind and write themselves.

services:
  postgres:
    # Pinned to a minor. `postgres:latest` would let a major upgrade arrive
    # between two runs of one suite -- an afternoon spent on a failure nobody
    # introduced.
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: doppel
      POSTGRES_PASSWORD: doppel
      POSTGRES_DB: doppel
    ports:
      # Not 5432: a developer with their own database would get a port conflict,
      # or worse, silently let these tests create and drop schemas in it.
      - "127.0.0.1:55432:5432"
    # No volume. A test database that survives a restart accumulates state the
    # tests did not create, and the first symptom is a failure that reproduces
    # on one machine only.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # `cargo test` starting before the server accepts connections is the
      # obvious flake, so the check is here rather than a sleep in a script.
      test: ["CMD-SHELL", "pg_isready -U doppel -d doppel"]
      interval: 1s
      timeout: 3s
      retries: 30

  doppel:
    # Not started by a bare `docker compose up`. See the header.
    profiles: ["doppel"]

    # Built rather than pulled: a local build is what you want when trying a
    # change, and nothing has to be staged first -- the Dockerfile uses a binary
    # from `dist/` when one is there and compiles its own otherwise.
    build:
      context: .

    ports:
      # Offset like the database's: a developer already running Doppel from
      # `cargo run` would otherwise collide.
      - "127.0.0.1:58080:8080"
      - "127.0.0.1:58081:8081"

    environment:
      # Where a client reaches the proxy, which is not what Doppel can see: it
      # binds 8080 inside the container and the port mapping above publishes
      # 58080. Without this, a rewritten redirect or a rewritten body would name
      # the container's own port and send the client somewhere it cannot go.
      DOPPEL_EXTERNAL_URL: "http://127.0.0.1:58080/"

    volumes:
      # Your own configuration, not the reference one:
      #
      #   mkdir -p config && cp main.example.yaml config/main.yaml
      #
      # `config/` is git-ignored, so editing a port, an upstream or a token
      # leaves no diff to explain. Mounting `main.example.yaml` directly, which
      # this used to do, made every experiment a change to a file the
      # documentation quotes.
      #
      # The directory, not the file, and not a preference: a single-file bind
      # mount makes the file a mount point, and a save writes a new file and
      # renames it over the old one, which no kernel will do over a mount point.
      # Every read worked and every write from the dashboard failed with
      # "Resource busy (os error 16)".
      - ./config:/etc/doppel:rw
      # Templates, and not optional: uploads through the admin API are written
      # here at runtime and would vanish with the container.
      - doppel-templates:/var/lib/doppel/templates

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      # `/api/v1/status` needs no token, answers only once the runtime is
      # compiled and both listeners are bound, and reports the revision in force
      # -- which is what "ready" means here rather than "the process started".
      # The port is the one inside the container.
      #
      # `-f` is the flag that matters: without it curl exits 0 on a 500, and the
      # check would report a container healthy for answering at all.
      #
      # This assumes `admin.enable` is true, as `main.example.yaml` has it. A
      # configuration that turns the admin listener off has nothing to probe;
      # drop the healthcheck rather than pointing it at the proxy port, where
      # every path either reaches an upstream or is a mock.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/api/v1/status"]
      interval: 5s
      timeout: 3s
      # Startup is well under a second; this is slack for a cold container on a
      # loaded machine, not an expectation.
      start_period: 5s
      retries: 5

volumes:
  doppel-templates:
