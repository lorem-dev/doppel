  <stop offset="1" stop-color="#9CC4B9"/>
</linearGradient>
<linearGradient id="ghost" x1="0" y1="0" x2="0.3" y2="1">
  <stop offset="0" stop-color="#96F2FF" stop-opacity="0.58"/>
  <stop offset="1" stop-color="#4C97FF" stop-opacity="0.16"/>
</linearGradient>

