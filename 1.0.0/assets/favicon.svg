<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>doppel favicon</title>
<!-- The small size variant of assets/icon.svg, and the source of
     assets/favicon.ico. The full icon is two overlapping documents; at 16
     and 32 pixels that composition collapses into an unreadable smudge, so
     the favicon keeps the background and the code glyph and drops the
     cards. Nothing here is a new shape: the gradients and the glyph come
     from icon.svg unchanged, only scaled. AGENTS.md carries the command
     that rebuilds the .ico from this file. -->
