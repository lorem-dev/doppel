# CI: the same gate a change has to pass locally -- `cargo fmt --check`,
# `cargo clippy --all-targets -- -D warnings`, `cargo test` -- plus a strict
# documentation build.
#
# Runs on every push to main and develop, and on every pull request.

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

# One run per branch or pull request, newest only. A push to a branch that has
# an open pull request otherwise starts two runs of the same commit, and a
# second push leaves both queued against a commit nobody is waiting on.
#
# Keyed on the pull request when there is one, so a branch's push run and its
# pull-request run stay separate and each cancels only its own predecessor.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    # A cold run is a few minutes. Anything near this bound is stuck, and
    # failing then beats holding a runner for the six-hour default.
    timeout-minutes: 30

    # The PostgreSQL store suites need a database. Without one they skip
    # themselves, which is right on a laptop and wrong here -- see
    # DOPPEL_REQUIRE_DATABASE below.
    #
    # Port 5432 rather than the 55432 `docker-compose.yml` uses: that offset
    # exists so a developer's own database is not touched, and a service
    # container has no such neighbour.
    services:
      postgres:
        # Pinned to the same minor version as docker-compose.yml. `latest`
        # would let a major upgrade arrive between two runs of one suite.
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: doppel
          POSTGRES_PASSWORD: doppel
          POSTGRES_DB: doppel
        ports:
          - 5432:5432
        # Without this the first test can beat the server to accepting
        # connections, which is the obvious flake.
        options: >-
          --health-cmd "pg_isready -U doppel -d doppel"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    env:
      DOPPEL_TEST_DATABASE_URL: postgres://doppel:doppel@127.0.0.1:5432/doppel
      # Turns a skipped database test into a failure. `cargo test` captures the
      # output of passing tests, so a skip notice reaches nobody: a run that was
      # supposed to exercise the store and silently did not is worse than one
      # that failed.
      DOPPEL_REQUIRE_DATABASE: "1"
      # Same idea as DOPPEL_REQUIRE_DATABASE, for the dashboard: the suites that
      # exercise real asset delivery skip themselves when the binary was built
      # without `frontend/dist`, which is right on a laptop and wrong here.
      DOPPEL_REQUIRE_DASHBOARD_ASSETS: "1"

    steps:
      # `lfs: true` because the icons are tracked through git-lfs and the frontend
      # build copies the favicon out of `assets/`. Without it the checkout holds a
      # pointer file and the copy lands a few lines of text where an image goes.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Built here rather than pulled from the frontend job as an artifact: this
      # keeps the two jobs independent and parallel, and twenty seconds of npm is
      # cheaper than serialising the graph. The admin crate's build script embeds
      # whatever is in `frontend/dist`, so this has to happen before `cargo test`.
      - name: Build the dashboard for the admin crate to embed
        run: npm --prefix frontend ci && npm --prefix frontend run build

      # No toolchain is named here. `rust-toolchain.toml` pins the channel and
      # the components, and rustup honours it; naming a version in the workflow
      # too would be a second pin to keep in step with the first.
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Without this a failing run saves nothing, so the retry after a red
          # build recompiles the whole dependency graph from scratch.
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      # Pinned to an exact release: astral-sh publishes `v9.0.0` but stopped
      # publishing the sliding major tag after `v7`, so `@v9` resolves to
      # nothing and the job fails before it runs.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      # After the tests, so the workspace is already compiled and this only has
      # to run the binary. A stale schema is worse than none -- editors report
      # mistakes that are not mistakes and accept fields that no longer exist --
      # and it is generated, so nothing but a check catches a forgotten
      # regeneration.
      #
      # `cargo test` covers the same ground through a drift test in
      # `config::schema`, deliberately: that one fails for whoever runs the
      # suite locally, this one names the fix in a step whose title says what
      # broke.
      - name: Configuration schema is up to date
        run: uv run scripts/config_schema.py --check

      # The parameter reference is generated from that schema, so it goes stale the
      # same way and for the same reason: nobody regenerates a file by hand twice.
      - name: Parameter reference is up to date
        run: uv run scripts/parameters_doc.py --check

  docs:
    name: Documentation builds
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `lfs: true` for the icons the documentation shows; see the rust job.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      # Pinned to an exact release, unlike every other action here. astral-sh
      # publishes `v9.0.0` but stopped publishing the sliding major tag after
      # `v7`, so `@v9` resolves to nothing and the job fails before it runs.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      # Built on every pull request, not only when publishing. `--strict` turns
      # a broken internal link into a failure, and the link that breaks is
      # usually in a page nobody edited -- the one pointing at the page that
      # moved.
      - name: Build the site (strict)
        run: uv run --with-requirements docs/requirements.txt mkdocs build --strict

      # `--strict` catches a broken link between pages; this catches the links the
      # dashboard builds at runtime, which mkdocs cannot see. A wrong fragment is
      # silent in a browser -- the page opens at the top and nobody notices.
      - name: Dashboard documentation links resolve
        run: uv run scripts/check_docs_links.py

  frontend:
    name: Frontend lint, types, tests, size
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # Two projects: the application and the Playwright suite. They have
      # different globals -- jest's and Playwright's `expect` collide -- so a
      # single project would have to pick one and leave the other unchecked.
      - name: Types
        run: npm run typecheck && npx tsc --noEmit -p tsconfig.e2e.json
        working-directory: frontend

      # Before the tests, because the bundle-size suite measures what this
      # produces. A test that silently skipped when `dist` was missing would make
      # the budget a preference again.
      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Tests, including the bundle-size budgets
        run: npm test
        working-directory: frontend

  e2e:
    name: Dashboard end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # The dashboard is embedded at compile time, so the order matters: build the
      # assets, then the binary. Building the binary first embeds nothing and every
      # scenario then fails against a 503.
      - name: Build the dashboard
        run: npm run build
        working-directory: frontend

      - name: Build the binary the specs drive
        run: cargo build -p doppel-cli

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run the scenarios
        run: npm run e2e
        working-directory: frontend

      # Only on a failure, and only the report: a trace for a green run is an
      # upload nobody opens.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # The image, built and thrown away.
  #
  # It used to be built only by `release.yml`, on a tag -- so a change that broke
  # the Dockerfile was found by the release that was supposed to publish it, at
  # the one moment when the fix costs a second tag. This job answers the same
  # question earlier and for free.
  #
  # Three deliberate limits:
  #
  # * **Nothing is pushed and nothing logs in.** The question is whether the
  #   image builds, not whether this branch can publish; a job that needed
  #   credentials could not run on a fork.
  # * **One platform, the runner's own.** The other architecture means QEMU,
  #   which turns a two-minute compile into most of an hour -- see the Dockerfile
  #   header. The release builds each natively and stages the binaries, which is
  #   a different path and is checked by the release.
  # * **From source, with nothing staged.** That is the branch a developer hits
  #   with `docker build .` on a checkout: the compile *and* the dashboard build
  #   happen inside the image. The release never runs it, so nothing else does.
  image:
    name: Image builds
    # A push to main, and a pull request aiming at it -- which is what a release
    # goes through, and the point is to know before the tag rather than after.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # `assets/favicon.ico` is an LFS object and the frontend's prebuild step
          # copies it into `public/`. Without this the build stage gets a pointer
          # file, and vite ships a hundred bytes of ASCII as the favicon.
          lfs: true

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      # Cached because otherwise every push to main pays for a release-profile
      # compile of the whole workspace inside the image.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Not loaded into the daemon either: nothing here runs it, and a load
          # is a copy of a 30 MB image nobody reads.
          load: false
          tags: doppel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
