site_name: Doppel
site_description: A doppelganger for your backend -- an HTTP proxy that forwards, degrades, or replaces it.
# Where GitHub Pages serves this from. Needed for the sitemap and the
# canonical link; a project site lives under /<repo>/, not at the domain root,
# and without this both point at the wrong place.
site_url: https://lorem-dev.github.io/doppel/
repo_url: https://github.com/lorem-dev/doppel
edit_uri: ""

theme:
  name: material
  # Rendered from `docs/assets/logo.svg` at 512x512, which is oversized for
  # both uses on purpose: the header renders it around 24px and a favicon is
  # smaller still, but browsers pick this up on retina displays and mkdocs
  # copies it verbatim rather than resampling.
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Overview:
      - What Doppel is: index.md
      - Concepts: overview/concepts.md
  - Usage:
      - Getting started: usage/getting-started.md
      - Proxying to an upstream: usage/proxying.md
      - Injecting faults: usage/faults.md
      - Mocking endpoints: usage/mocks.md
      - Several backends behind one port: usage/multiple-backends.md
      - Changing configuration while it runs: usage/runtime-changes.md
      - The admin API: usage/admin-api.md
      - Storing configuration in PostgreSQL: usage/storage.md
      - Observability: usage/observability.md
      - Configuration reference: usage/configuration.md
      - CLI reference: usage/cli.md
  - Development:
      - Working on Doppel: development/index.md
      - Architecture: development/architecture.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

strict: true
